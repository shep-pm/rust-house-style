name: file size
# Reusable workflow: the mechanical half of IR-48.
#
# Counts every line of every tracked `.rs` file and fails a file over 1000.
# Files matched by `exclude` are generated and skipped. A file listed in the
# baseline may shrink but never grow. Callers pin this workflow by tag:
#
#   uses: shep-pm/rust-house-style/.github/workflows/file-size.yml@v0.1.0
#
# The check is the last step, so tests/file-size/run.sh can lift it out and
# run the exact code CI runs.
on:
  workflow_call:
    inputs:
      exclude:
        description: >-
          Generated files to skip, one git pathspec glob per line, such as
          `**/generated/*.rs`. Matched with git's `:(exclude,glob)` magic.
        type: string
        default: ""
      baseline:
        description: >-
          Known offenders, one `<lines> <path>` per line, `#` for comments.
          A missing file is an empty baseline.
        type: string
        default: .github/rust-file-size-baseline.txt
      ratchet:
        description: >-
          Fail, rather than notice, when a listed file has shrunk below its
          entry. Forces the entry down in the same change.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check file sizes
        shell: python3 {0}
        env:
          EXCLUDE: ${{ inputs.exclude }}
          BASELINE: ${{ inputs.baseline }}
          RATCHET: ${{ inputs.ratchet }}
        run: |
          import os
          import subprocess
          import sys

          LIMIT = 1000
          baseline_path = os.environ.get("BASELINE", "")
          ratchet = os.environ.get("RATCHET") == "true"
          exclude = [g.strip() for g in os.environ.get("EXCLUDE", "").splitlines() if g.strip()]
          failed = False


          def report(level, path, message):
              print(f"::{level} file={path},title=IR-48::{message}")


          def fail(path, message):
              global failed
              failed = True
              report("error", path, message)


          ceilings = {}
          if baseline_path and os.path.isfile(baseline_path):
              with open(baseline_path, encoding="utf-8") as fh:
                  for number, raw in enumerate(fh, 1):
                      line = raw.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split(None, 1)
                      if len(parts) != 2 or not parts[0].isdigit():
                          fail(baseline_path, f"line {number}: expected `<lines> <path>`, got `{line}`")
                      elif parts[1] in ceilings:
                          fail(baseline_path, f"line {number}: `{parts[1]}` is listed twice")
                      else:
                          ceilings[parts[1]] = int(parts[0])
          else:
              print(f"no baseline at `{baseline_path}`, treating it as empty")

          pathspecs = ["*.rs"] + [f":(exclude,glob){g}" for g in exclude]
          listed = subprocess.run(
              ["git", "ls-files", "-z", "--", *pathspecs],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8").split("\0")

          counts = {}
          for path in filter(None, listed):
              try:
                  with open(path, "rb") as fh:
                      data = fh.read()
              except OSError:
                  continue
              counts[path] = data.count(b"\n") + (1 if data and not data.endswith(b"\n") else 0)

          over = 0
          for path, n in sorted(counts.items(), key=lambda item: -item[1]):
              ceiling = ceilings.get(path)
              if ceiling is None:
                  if n > LIMIT:
                      over += 1
                      fail(path, f"{n} lines, over {LIMIT}. Split it (IR-48).")
                  continue
              if n > LIMIT:
                  over += 1
              if n > ceiling:
                  fail(path, f"{n} lines, but {baseline_path} allows {ceiling}. A listed file may shrink but not grow.")
              elif n <= LIMIT:
                  message = f"{n} lines, now within the limit. Remove it from {baseline_path}."
                  fail(path, message) if ratchet else report("notice", path, message)
              elif n < ceiling:
                  message = f"{n} lines, but {baseline_path} says {ceiling}. Lower the entry to {n}."
                  fail(path, message) if ratchet else report("notice", path, message)

          for path in ceilings:
              if path not in counts:
                  message = f"{baseline_path} lists a file that is not a counted .rs file. Remove the entry."
                  fail(path, message) if ratchet else report("notice", path, message)

          print(f"checked {len(counts)} .rs files, {over} over {LIMIT}, {len(ceilings)} baselined")
          sys.exit(1 if failed else 0)
